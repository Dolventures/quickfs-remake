<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Financials Explorer</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
      min-height: 100vh;
    }

    /* ── Header ─────────────────────────────────────────────────────────── */
    header {
      background: #fff;
      border-bottom: 1px solid #e2e8f0;
      padding: 0 20px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-ticker {
      display: none;
      align-items: center;
      gap: 16px;
      flex: 1;
      padding-left: 20px;
    }

    .header-ticker.visible { display: flex; }

    .header-ticker-symbol {
      font-size: 0.8rem;
      font-weight: 700;
      color: #0f172a;
    }

    .header-stat {
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .header-stat-label {
      font-size: 0.58rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: #94a3b8;
    }

    .header-stat-value {
      font-size: 0.78rem;
      font-weight: 600;
      color: #0f172a;
      font-variant-numeric: tabular-nums;
    }

    .logo {
      font-size: 0.85rem;
      font-weight: 700;
      color: #0f172a;
      letter-spacing: -0.2px;
      white-space: nowrap;
    }

    .logo span { color: #2563eb; }

    form.search-bar {
      display: flex;
      gap: 6px;
    }

    .search-bar input {
      padding: 5px 10px;
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 5px;
      color: #0f172a;
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 1px;
      text-transform: uppercase;
      width: 140px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .search-bar input::placeholder { text-transform: none; letter-spacing: normal; color: #94a3b8; font-weight: 400; }
    .search-bar input:focus { border-color: #2563eb; box-shadow: 0 0 0 2px rgba(37,99,235,0.1); background: #fff; }

    .search-bar button {
      padding: 5px 12px;
      background: #2563eb;
      border: none;
      border-radius: 5px;
      color: #fff;
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    .search-bar button:hover    { background: #1d4ed8; }
    .search-bar button:disabled { background: #93c5fd; cursor: not-allowed; }

    /* ── Page content ────────────────────────────────────────────────────── */
    main {
      max-width: 1600px;
      margin: 0 auto;
      padding: 14px 16px 40px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .ticker-heading { display: none; }

    .section-label {
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #94a3b8;
      margin-bottom: 10px;
      margin-top: 4px;
    }

    /* ── Card groups ─────────────────────────────────────────────────────── */
    .card-groups {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .card-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .card-group-label {
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #64748b;
      padding-bottom: 4px;
      border-bottom: 1px solid #e2e8f0;
    }

    /* ── Summary cards ───────────────────────────────────────────────────── */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
      gap: 6px;
    }

    .summary-card {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .card-label {
      font-size: 0.62rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: #64748b;
    }

    .card-value {
      font-size: 1rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.3px;
    }

    .card-value.positive { color: #16a34a; }
    .card-value.negative { color: #dc2626; }
    .card-value.neutral  { color: #0f172a; }

    .card-sub {
      font-size: 0.58rem;
      color: #94a3b8;
      margin-top: 1px;
    }

    .scale-note {
      font-size: 0.6rem;
      font-weight: 400;
      color: #94a3b8;
      text-transform: none;
      letter-spacing: 0;
    }

    .scale-toggle {
      display: flex;
      align-items: center;
      gap: 2px;
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 2px;
    }

    .scale-toggle-label {
      font-size: 0.65rem;
      font-weight: 600;
      color: #94a3b8;
      padding: 0 4px;
    }

    .scale-btn {
      font-size: 0.65rem;
      font-weight: 600;
      padding: 2px 7px;
      border: none;
      border-radius: 4px;
      background: transparent;
      color: #64748b;
      cursor: pointer;
      transition: background 0.12s, color 0.12s;
    }

    .scale-btn.active {
      background: #fff;
      color: #0f172a;
      box-shadow: 0 1px 2px rgba(0,0,0,0.08);
    }

    /* ── Tables ──────────────────────────────────────────────────────────── */
    .table-wrapper {
      overflow-x: auto;
      border-radius: 6px;
      border: 1px solid #e2e8f0;
      background: #fff;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.76rem;
      table-layout: fixed;
    }

    thead tr { background: #f8fafc; }

    th {
      padding: 6px 10px;
      text-align: right;
      color: #64748b;
      font-weight: 600;
      font-size: 0.68rem;
      white-space: nowrap;
      border-bottom: 1px solid #e2e8f0;
    }

    th:first-child {
      text-align: left;
      position: sticky;
      left: 0;
      background: #f8fafc;
      z-index: 2;
      border-right: 1px solid #e2e8f0;
    }

    tbody tr { transition: background 0.1s; }
    tbody tr:hover { background: #fafbfc; }
    tbody tr.separator-row { border-top: 1px solid #e2e8f0; }

    td {
      padding: 5px 10px;
      text-align: right;
      border-bottom: 1px solid #f1f5f9;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
      color: #0f172a;
    }

    td:first-child {
      text-align: left;
      color: #475569;
      font-weight: 500;
      position: sticky;
      left: 0;
      background: #fff;
      z-index: 1;
      border-right: 1px solid #e2e8f0;
    }

    tbody tr:hover td:first-child { background: #fafbfc; }
    tbody tr.separator-row td:first-child { font-weight: 600; color: #1e293b; }

    .positive { color: inherit; }
    .negative { color: inherit; }

    /* ── TTM column ──────────────────────────────────────────────────────── */
    th.ttm-col, td.ttm-col {
      background: #f0f7ff;
      border-right: 1px solid #bfdbfe;
      font-weight: 600;
    }

    thead tr th.ttm-col {
      color: #2563eb;
    }

    /* ── Valuation context table ─────────────────────────────────────────── */
    .vc-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.76rem;
      background: #fff;
    }
    .vc-table th {
      background: #f8fafc;
      padding: 6px 10px;
      font-size: 0.66rem;
      font-weight: 600;
      color: #64748b;
      text-align: right;
      border-bottom: 1px solid #e2e8f0;
      white-space: nowrap;
    }
    .vc-table th:first-child { text-align: left; }
    .vc-table td {
      padding: 5px 10px;
      text-align: right;
      border-bottom: 1px solid #f1f5f9;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      color: #0f172a;
    }
    .vc-table td:first-child { text-align: left; color: #475569; font-weight: 500; }
    .vc-table tr:hover td { background: #fafbfc; }
    .vc-signal {
      display: inline-block;
      padding: 1px 6px;
      border-radius: 3px;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.3px;
    }
    .vc-signal.cheap    { background: #dcfce7; color: #15803d; }
    .vc-signal.expensive { background: #fee2e2; color: #b91c1c; }
    .vc-signal.neutral  { background: #f1f5f9; color: #64748b; }
    .vc-bar-wrap {
      display: flex;
      align-items: center;
      gap: 4px;
      justify-content: flex-end;
    }
    .vc-bar-track {
      width: 80px;
      height: 4px;
      background: #e2e8f0;
      border-radius: 2px;
      position: relative;
      flex-shrink: 0;
    }
    .vc-bar-avg  { position: absolute; top: -2px; width: 2px; height: 8px; background: #94a3b8; border-radius: 1px; }
    .vc-bar-curr { position: absolute; top: -3px; width: 4px; height: 10px; border-radius: 1px; }

    /* ── Spinner ─────────────────────────────────────────────────────────── */
    .spinner-wrap {
      display: none;
      align-items: center;
      justify-content: center;
      padding: 60px;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #e2e8f0;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin 0.65s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Error ───────────────────────────────────────────────────────────── */
    .error-msg {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
      padding: 14px 18px;
      border-radius: 8px;
      font-size: 0.875rem;
    }

    /* ── Empty state ─────────────────────────────────────────────────────── */
    .empty-state {
      text-align: center;
      padding: 80px 24px;
      color: #94a3b8;
    }

    .empty-state .icon { font-size: 2.5rem; margin-bottom: 12px; }
    .empty-state p { font-size: 0.95rem; }
  </style>
</head>
<body>

  <header>
    <div class="logo">Financials<span>.</span></div>
    <div class="header-ticker" id="header-ticker">
      <div class="header-ticker-symbol" id="header-symbol"></div>
      <div class="header-stat">
        <div class="header-stat-label">Share Price</div>
        <div class="header-stat-value" id="header-price">—</div>
      </div>
      <div class="header-stat">
        <div class="header-stat-label">Market Cap</div>
        <div class="header-stat-value" id="header-mktcap">—</div>
      </div>
      <div class="header-stat">
        <div class="header-stat-label">Enterprise Value</div>
        <div class="header-stat-value" id="header-ev">—</div>
      </div>
    </div>
    <div class="scale-toggle" id="scale-toggle" style="display:none">
      <span class="scale-toggle-label">$</span>
      <button class="scale-btn active" data-unit="B">B</button>
      <button class="scale-btn" data-unit="M">M</button>
      <button class="scale-btn" data-unit="K">K</button>
    </div>
    <form class="search-bar" id="search-form">
      <input id="ticker-input" type="text" placeholder="Ticker symbol" maxlength="10" autocomplete="off" />
      <button type="submit" id="search-btn">Search</button>
    </form>
  </header>

  <main>
    <div class="spinner-wrap" id="spinner-wrap"><div class="spinner"></div></div>
    <div id="result">
      <div class="empty-state">
        <div class="icon">📊</div>
        <p>Enter a ticker symbol to load historical financials from SEC EDGAR.</p>
      </div>
    </div>
  </main>

  <script>
    // ── Metric definitions ───────────────────────────────────────────────────

    const INCOME_METRICS = [
      { key: "Revenue",               label: "Revenue",             fmt: "dollar" },
      { key: "RevenueGrowth",         label: "Revenue Growth %",    fmt: "pct"    },
      { key: "CostOfSales",           label: "Cost of Sales",       fmt: "dollar" },
      { key: "GrossMargin",           label: "Gross Margin %",      fmt: "pct"    },
      { key: "OperatingExpenses",     label: "Operating Expenses",  fmt: "dollar" },
      { key: "DA",                    label: "D&A",                 fmt: "dollar" },
      { key: "EBITDA",                label: "EBITDA",              fmt: "dollar" },
      { key: "EBITDAMargin",          label: "EBITDA Margin %",     fmt: "pct"    },
      { key: "OperatingIncome",       label: "Operating Income",    fmt: "dollar" },
      { key: "OperatingIncomeGrowth", label: "Op. Income Growth %", fmt: "pct"    },
      { key: "OperatingMargin",       label: "Operating Margin %",  fmt: "pct"    },
      { key: "InterestExpense",       label: "Interest Expense",    fmt: "dollar" },
      { key: "PreTaxIncome",          label: "Pre-tax Income",      fmt: "dollar" },
      { key: "NetIncome",             label: "Net Income",          fmt: "dollar" },
      { key: "DilutedShares",         label: "Diluted Shares",      fmt: "shares" },
      { key: "EPSDiluted",            label: "EPS (Diluted)",       fmt: "eps"    },
    ];

    const BS_METRICS = [
      { key: "Cash",               label: "Cash & Equivalents",   fmt: "dollar" },
      { key: "CurrentAssets",      label: "Current Assets",       fmt: "dollar" },
      { key: "TotalAssets",        label: "Total Assets",         fmt: "dollar" },
      { key: "CurrentLiabilities", label: "Current Liabilities",  fmt: "dollar" },
      { key: "CurrentDebt",        label: "Current Debt",         fmt: "dollar" },
      { key: "LongTermDebt",       label: "Long-term Debt",       fmt: "dollar" },
      { key: "TotalDebt",          label: "Total Debt",           fmt: "dollar" },
      { key: "TotalLiabilities",   label: "Total Liabilities",    fmt: "dollar" },
      { key: "NetDebt",            label: "Net Debt",             fmt: "dollar" },
    ];

    const CF_METRICS = [
      { key: "OperatingCF",  label: "Operating Cash Flow", fmt: "dollar" },
      { key: "InvestingCF",  label: "Investing Cash Flow", fmt: "dollar" },
      { key: "FinancingCF",  label: "Financing Cash Flow", fmt: "dollar" },
      { key: "FreeCashFlow", label: "Free Cash Flow",      fmt: "dollar" },
    ];

    const VALUATION_METRICS = [
      { key: "MarketCap",      label: "Market Cap",       fmt: "dollar" },
      { key: "EV",             label: "Enterprise Value", fmt: "dollar" },
      { key: "EVToSales",      label: "EV / Sales",       fmt: "ratio"  },
      { key: "EVToEBITDA",     label: "EV / EBITDA",      fmt: "ratio"  },
      { key: "FCFToEV",        label: "FCF / EV",         fmt: "pct"    },
      { key: "FCFToMarketCap", label: "FCF / Mkt Cap",    fmt: "pct"    },
      { key: "FCFPerShare",    label: "FCF / Share",      fmt: "eps"    },
    ];

    const RETURNS_METRICS = [
      { key: "ROIC",                    label: "ROIC",               fmt: "pct"   },
      { key: "ROE",                     label: "ROE",                fmt: "pct"   },
      { key: "ROA",                     label: "ROA",                fmt: "pct"   },
      { key: "NetDebtToEBITDA",         label: "Net Debt / EBITDA",  fmt: "ratio" },
      { key: "InterestCoverage",        label: "Interest Coverage",  fmt: "ratio" },
      { key: "CurrentAssetsToLiabilities", label: "Current Ratio",   fmt: "ratio" },
    ];

    const CARD_GROUPS = [
      {
        label: "Valuation",
        cards: [
          { key: "current_fcf_yield", label: "Current FCF Yield", fmt: "pct"   },
          { key: "ev_to_ebitda",      label: "EV / EBITDA",       fmt: "ratio" },
          { key: "ev_to_sales",       label: "EV / Sales",        fmt: "ratio" },
          { key: "avg_fcf_yield",     label: "Avg FCF Yield",     fmt: "pct", nKey: "fcf_yield_n_years" },
        ]
      },
      {
        label: "Returns (Full History Avg)",
        nKey: "returns_n_years",
        cards: [
          { key: "avg_roic", label: "Avg ROIC", fmt: "pct" },
          { key: "avg_roe",  label: "Avg ROE",  fmt: "pct" },
          { key: "avg_roa",  label: "Avg ROA",  fmt: "pct" },
        ]
      },
      {
        label: "Leverage",
        cards: [
          { key: "net_debt_to_ebitda", label: "Net Debt / EBITDA", fmt: "ratio" },
          { key: "interest_coverage",  label: "Interest Coverage", fmt: "ratio" },
        ]
      },
      {
        label: "Growth (Full History CAGR)",
        cards: [
          { key: "revenue_cagr", label: "Revenue CAGR",     fmt: "pct", nKey: "revenue_cagr_n_years" },
          { key: "fcf_cagr",     label: "FCF CAGR",         fmt: "pct", nKey: "fcf_cagr_n_years"     },
          { key: "asset_cagr",   label: "Asset CAGR",       fmt: "pct", nKey: "asset_cagr_n_years"   },
          { key: "share_cagr",   label: "Share Count CAGR", fmt: "pct", nKey: "share_cagr_n_years"   },
        ]
      },
    ];

    // ── Global scale (set in renderAll based on company size) ────────────────
    let G_SCALE = { div: 1e6, unit: "M", label: "millions" };

    function computeScale(income) {
      const revs = income.map(r => r.Revenue).filter(v => v != null && v > 0);
      const max  = revs.length ? Math.max(...revs) : 0;
      if (max >= 1e9) return { div: 1e9, unit: "B", label: "billions"  };
      if (max >= 1e6) return { div: 1e6, unit: "M", label: "millions"  };
      return              { div: 1e3, unit: "K", label: "thousands" };
    }

    // ── Formatters ───────────────────────────────────────────────────────────

    function fmtDollar(val) {
      if (val == null || isNaN(val) || !isFinite(val)) return "—";
      const scaled   = Math.abs(val) / G_SCALE.div;
      const decimals = scaled >= 100 ? 0 : scaled >= 10 ? 1 : 2;
      const parts    = scaled.toFixed(decimals).split(".");
      parts[0]       = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",");
      return (val < 0 ? "-$" : "$") + parts.join(".") + G_SCALE.unit;
    }

    function fmtShares(val) {
      if (val == null || isNaN(val)) return "—";
      const abs = Math.abs(val);
      if      (abs >= 1e9) return (val / 1e9).toFixed(2) + "B";
      else if (abs >= 1e6) return (val / 1e6).toFixed(1) + "M";
      else if (abs >= 1e3) return (val / 1e3).toFixed(1) + "K";
      return val.toFixed(0);
    }

    function fmtEps(val) {
      if (val == null || isNaN(val)) return "—";
      return (val < 0 ? "-$" : "$") + Math.abs(val).toFixed(2);
    }

    function fmtPct(val, sign = false) {
      if (val == null || isNaN(val)) return "—";
      const prefix = sign ? (val < 0 ? "-" : "+") : (val < 0 ? "-" : "");
      return prefix + Math.abs(val).toFixed(1) + "%";
    }

    function fmtRatio(val) {
      if (val == null || isNaN(val)) return "—";
      return val.toFixed(2) + "x";
    }

    function format(val, fmt) {
      if (fmt === "dollar") return fmtDollar(val);
      if (fmt === "shares") return fmtShares(val);
      if (fmt === "eps")    return fmtEps(val);
      if (fmt === "pct")    return fmtPct(val);
      if (fmt === "ratio")  return fmtRatio(val);
      return val;
    }

    function yearLabel(dateStr) { return dateStr.slice(0, 4); }

    // ── Extract embedded TTM row (period_end is a label, not a date) ─────────
    function extractTTMRow(rows) {
      const ttmRow   = rows.find(r => !/^\d{4}/.test(String(r.period_end)));
      const dateRows = rows.filter(r => /^\d{4}/.test(String(r.period_end)));
      return {
        ttmRow,
        ttmLabel: ttmRow ? ttmRow.period_end : null,
        dateRows,
      };
    }

    // ── Table builder ────────────────────────────────────────────────────────

    function buildTable(rows, metrics, ttmLabel = null, ttmRow = null) {
      rows = [...rows].reverse();
      const years = rows.map(r => r.period_end);
      const hasTTM = ttmLabel && ttmRow;

      const dataCols = (hasTTM ? 1 : 0) + years.length;
      const colgroup = `<colgroup>
        <col style="width:160px">
        ${Array(dataCols).fill('<col style="width:78px">').join("")}
      </colgroup>`;

      let html = `<div class="table-wrapper"><table>
        ${colgroup}
        <thead><tr>
          <th>Metric <span class="scale-note">($ ${G_SCALE.unit})</span></th>
          ${hasTTM ? `<th class="ttm-col">${ttmLabel}</th>` : ""}
          ${years.map(y => `<th>${yearLabel(y)}</th>`).join("")}
        </tr></thead><tbody>`;

      for (const m of metrics) {
        html += `<tr${m.sep ? ' class="separator-row"' : ""}><td>${m.label}</td>`;
        if (hasTTM) {
          const val = ttmRow[m.key];
          const cls = val > 0 ? "positive" : val < 0 ? "negative" : "";
          html += `<td class="${cls} ttm-col">${format(val, m.fmt)}</td>`;
        }
        for (const row of rows) {
          const val = row[m.key];
          const cls = val > 0 ? "positive" : val < 0 ? "negative" : "";
          html += `<td class="${cls}">${format(val, m.fmt)}</td>`;
        }
        html += `</tr>`;
      }

      return html + `</tbody></table></div>`;
    }

    // ── Card groups ──────────────────────────────────────────────────────────

    function buildCardGroups(summary) {
      return CARD_GROUPS.map(group => {
        const groupN = group.nKey ? summary[group.nKey] : null;
        const cards = group.cards.map(card => {
          const val = summary[card.key];
          const formatted = card.fmt === "pct" ? fmtPct(val) : fmtRatio(val);
          const n = card.nKey ? summary[card.nKey] : groupN;
          const sub = n != null ? `<div class="card-sub">${n} yr avg</div>` : "";
          return `<div class="summary-card">
            <div class="card-label">${card.label}</div>
            <div class="card-value neutral">${formatted}</div>
            ${sub}
          </div>`;
        }).join("");
        return `<div class="card-group">
          <div class="card-group-label">${group.label}</div>
          <div class="summary-grid">${cards}</div>
        </div>`;
      }).join("");
    }

    // ── Valuation context ────────────────────────────────────────────────────

    function buildValuationContext(rows) {
      if (!rows || rows.length === 0) return "";

      const fmtVal = (v, fmt) => {
        if (v == null || isNaN(v)) return "—";
        return fmt === "pct" ? fmtPct(v) : fmtRatio(v);
      };

      const signal = (vs) => {
        if (vs == null || isNaN(vs)) return `<span class="vc-signal neutral">—</span>`;
        const abs = Math.abs(vs).toFixed(1);
        if (vs > 10)  return `<span class="vc-signal cheap">+${abs}% cheap</span>`;
        if (vs < -10) return `<span class="vc-signal expensive">${abs}% exp.</span>`;
        return `<span class="vc-signal neutral">~median</span>`;
      };

      // Mini range bar: lower = left = cheap for ratio metrics
      const bar = (curr, lo, hi) => {
        if (curr == null || lo == null || hi == null || hi === lo) return "";
        const pct = Math.max(0, Math.min(100, (curr - lo) / (hi - lo) * 100));
        // left (low multiple) = cheap = green; right (high multiple) = expensive = red
        const color = pct < 35 ? "#16a34a" : pct > 65 ? "#dc2626" : "#f59e0b";
        return `<div class="vc-bar-wrap">
          <div class="vc-bar-track">
            <div class="vc-bar-curr" style="left:${pct}%;background:${color};transform:translateX(-50%)"></div>
          </div>
        </div>`;
      };

      let html = `<div class="table-wrapper"><table class="vc-table">
        <thead><tr>
          <th>Metric</th>
          <th>Current</th>
          <th>Hist. Median</th>
          <th>Hist. Avg</th>
          <th>Range (min→max)</th>
          <th>vs Median</th>
        </tr></thead><tbody>`;

      for (const r of rows) {
        const rangeStr = `${fmtVal(r.hist_min, r.fmt)} → ${fmtVal(r.hist_max, r.fmt)}`;
        html += `<tr>
          <td>${r.label} <span style="color:#94a3b8;font-size:0.62rem">(${r.n_years}y)</span></td>
          <td style="font-weight:600">${fmtVal(r.current, r.fmt)}</td>
          <td>${fmtVal(r.hist_avg, r.fmt)}</td>
          <td>${fmtVal(r.hist_median, r.fmt)}</td>
          <td>${bar(r.current, r.hist_min, r.hist_max, r.lower_is_cheaper)}
              <span style="font-size:0.65rem;color:#94a3b8">${rangeStr}</span></td>
          <td>${signal(r.vs_median_pct)}</td>
        </tr>`;
      }

      return html + `</tbody></table></div>`;
    }

    // ── Render ───────────────────────────────────────────────────────────────

    function updateHeader(ticker, summary) {
      const price  = summary.share_price;
      const mktCap = summary.market_cap;
      const ev     = summary.ev;
      document.getElementById("header-symbol").textContent = ticker;
      document.getElementById("header-price").textContent  = price  != null ? "$" + price.toFixed(2) : "—";
      document.getElementById("header-mktcap").textContent = mktCap != null ? fmtDollar(mktCap)      : "—";
      document.getElementById("header-ev").textContent     = ev     != null ? fmtDollar(ev)           : "—";
      document.getElementById("header-ticker").classList.add("visible");
    }

    function renderAll(ticker, summary, income, balanceSheet, cashFlow, annualMetrics, ttm, valCtx) {
      // Only auto-compute scale on first render for this ticker; preserve user choice on re-render
      if (!_lastRenderArgs || _lastRenderArgs[0] !== ticker) {
        G_SCALE = computeScale(income);
      }
      setScaleToggle(G_SCALE.unit);
      updateHeader(ticker, summary);
      const ttmLabel = ttm ? ttm.period_label : null;
      document.getElementById("result").innerHTML = `
        <div>
          <div class="section-label">Valuation vs History</div>
          ${buildValuationContext(valCtx)}
        </div>
        <div>
          <div class="section-label">Key Metrics</div>
          <div class="card-groups">${buildCardGroups(summary)}</div>
        </div>
        <div>
          <div class="section-label">Income Statement</div>
          ${buildTable(income, INCOME_METRICS, ttmLabel, ttm ? ttm.income : null)}
        </div>
        <div>
          <div class="section-label">Balance Sheet</div>
          ${buildTable(balanceSheet, BS_METRICS, ttmLabel, ttm ? ttm.balance_sheet : null)}
        </div>
        <div>
          <div class="section-label">Cash Flow Statement</div>
          ${buildTable(cashFlow, CF_METRICS, ttmLabel, ttm ? ttm.cash_flow : null)}
        </div>
        <div>
          <div class="section-label">Valuation by Year</div>
          ${(() => { const am = extractTTMRow(annualMetrics); return buildTable(am.dateRows, VALUATION_METRICS, am.ttmLabel, am.ttmRow); })()}
        </div>
        <div>
          <div class="section-label">Returns &amp; Leverage by Year</div>
          ${(() => { const am = extractTTMRow(annualMetrics); return buildTable(am.dateRows, RETURNS_METRICS, am.ttmLabel, am.ttmRow); })()}
        </div>`;
    }

    function renderError(msg) {
      document.getElementById("result").innerHTML =
        `<div class="error-msg">${msg}</div>`;
    }

    // ── Scale toggle ─────────────────────────────────────────────────────────

    const SCALES = {
      B: { div: 1e9, unit: "B", label: "billions"  },
      M: { div: 1e6, unit: "M", label: "millions"  },
      K: { div: 1e3, unit: "K", label: "thousands" },
    };

    let _lastRenderArgs = null;

    document.getElementById("scale-toggle").addEventListener("click", (e) => {
      const btn = e.target.closest(".scale-btn");
      if (!btn || !_lastRenderArgs) return;
      const unit = btn.dataset.unit;
      G_SCALE = SCALES[unit];
      document.querySelectorAll(".scale-btn").forEach(b => b.classList.toggle("active", b.dataset.unit === unit));
      renderAll(..._lastRenderArgs);
    });

    function setScaleToggle(unit) {
      const toggle = document.getElementById("scale-toggle");
      toggle.style.display = "flex";
      document.querySelectorAll(".scale-btn").forEach(b => b.classList.toggle("active", b.dataset.unit === unit));
    }

    // ── Search ───────────────────────────────────────────────────────────────

    document.getElementById("search-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const ticker = document.getElementById("ticker-input").value.trim().toUpperCase();
      if (!ticker) return;

      const btn         = document.getElementById("search-btn");
      const spinnerWrap = document.getElementById("spinner-wrap");

      btn.disabled = true;
      spinnerWrap.style.display = "flex";
      document.getElementById("result").innerHTML = "";

      try {
        const res  = await fetch(`/api/financials?ticker=${encodeURIComponent(ticker)}`);
        const data = await res.json();
        if (!res.ok) { renderError(data.error || "An error occurred."); }
        else {
          _lastRenderArgs = [data.ticker, data.summary, data.income, data.balance_sheet, data.cash_flow, data.annual_metrics, data.ttm, data.valuation_context];
          renderAll(..._lastRenderArgs);
        }
      } catch (err) {
        renderError("Network error — could not reach the server.");
      } finally {
        btn.disabled = false;
        spinnerWrap.style.display = "none";
      }
    });
  </script>

</body>
</html>
